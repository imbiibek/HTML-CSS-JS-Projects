<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="script.js" defer></script>
</head>
<body>
     <h1 class="count"> 0 </h1>
    <button class="plus">+</button>
    <button class="minus">-</button> <br> <br>

    <div>Increment/Decrement by: <input type="number" class="changeBy" value="1" min="1" max="10"/> </div>

    <button class="reset"> Reset </button> 
</body>
</html>
